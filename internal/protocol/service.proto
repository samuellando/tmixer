syntax = "proto2";

option go_package = "./protocol";

service Tmixer {
  rpc Session(stream Request) returns (stream Response);
}

message Request {
  oneof payload {
    Args args = 1;
    Selection selection = 2;
  }
}

message Args {
  repeated string args = 1;
}

message Selection {
  required string project = 1;
}

message Response {
  repeated string projects = 1;
  optional string error = 2;
}
